---
- name: Ensure target namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ pathlens_kubeconfig | default(omit) }}"
    context: "{{ pathlens_kube_context }}"
    api_version: v1
    kind: Namespace
    name: "{{ pathlens_namespace }}"
    state: present
  when: pathlens_state == 'present'

- name: Deploy or upgrade PathLens service charts
  kubernetes.core.helm:
    kubeconfig: "{{ pathlens_kubeconfig | default(omit) }}"
    context: "{{ pathlens_kube_context }}"
    name: "{{ item.name }}"
    chart_ref: "{{ pathlens_charts_dir }}/{{ item.name }}"
    release_namespace: "{{ pathlens_namespace }}"
    create_namespace: false
    state: present
    # pathlens-infra pulls the Bitnami kafka/postgresql subcharts, so their .tgz files have to
    # be present in charts/pathlens-infra/charts before the release is rendered.
    dependency_update: true
    atomic: "{{ pathlens_atomic }}"
    wait: "{{ pathlens_wait }}"
    wait_timeout: "{{ pathlens_wait_timeout }}"
    values_files:
      - "{{ pathlens_charts_dir }}/{{ item.name }}/values.yaml"
      - "{{ pathlens_charts_dir }}/{{ item.name }}/values-{{ pathlens_env }}.yaml"
    # `image_tag` only applies to charts that ship a PathLens image; pathlens-infra opts out
    # with `set_image_tag: false` because its images are pinned by the subcharts themselves.
    set_values: >-
      {{ (item.secret_values | default([]))
         + ([{'value': 'image.tag=' + image_tag, 'value_type': 'string'}]
            if (image_tag is defined and (item.set_image_tag | default(true))) else []) }}
  loop: "{{ pathlens_services }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - pathlens_state == 'present'
    - pathlens_target_service is not defined or item.name == pathlens_target_service
  no_log: "{{ pathlens_hide_secret_logs | default(true) }}"

- name: Remove PathLens service charts
  kubernetes.core.helm:
    kubeconfig: "{{ pathlens_kubeconfig | default(omit) }}"
    context: "{{ pathlens_kube_context }}"
    name: "{{ item.name }}"
    release_namespace: "{{ pathlens_namespace }}"
    state: absent
    wait: "{{ pathlens_wait }}"
    wait_timeout: "{{ pathlens_wait_timeout }}"
  loop: "{{ pathlens_services | reverse | list }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - pathlens_state == 'absent'
    - pathlens_target_service is not defined or item.name == pathlens_target_service
