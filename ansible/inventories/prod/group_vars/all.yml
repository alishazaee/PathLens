---
pathlens_env: prod
pathlens_namespace: pathlens-prod
pathlens_kube_context: pathlens-prod
pathlens_charts_dir: "{{ playbook_dir }}/../../charts"

# Every service that talks to PostgreSQL uses the single `pathlens` role created by the
# pathlens-infra release, so they all authenticate with the same secret. Real values live in
# the (vault-encrypted) group_vars/vault.yml of this inventory.
pathlens_db_password: "{{ vault_pathlens_db_password }}"

# Which charts to manage for this environment, in install order, and any per-release secret
# overrides layered on top of charts/<name>/values.yaml + values-{{ pathlens_env }}.yaml.
# pathlens-infra comes first: it provides the Kafka and PostgreSQL every other release
# expects at pathlens-infra-kafka:9092 / pathlens-infra-postgresql:5432. Point the services at
# managed infrastructure instead by disabling its subcharts - see charts/pathlens-infra.
pathlens_services:
  - name: pathlens-infra
    set_image_tag: false
    secret_values:
      - value: "postgresql.auth.password={{ pathlens_db_password }}"
        value_type: string
      - value: "postgresql.auth.postgresPassword={{ vault_pathlens_postgres_admin_password }}"
        value_type: string
  - name: device-rest
    secret_values:
      - value: "database.password={{ pathlens_db_password }}"
        value_type: string
  - name: alerting-rest
    secret_values:
      - value: "database.password={{ pathlens_db_password }}"
        value_type: string
  - name: alerting-evaluator
    secret_values:
      - value: "config.postgresConfig.password={{ pathlens_db_password }}"
        value_type: string
  - name: processor
    secret_values: []
  - name: frontend
    secret_values: []
