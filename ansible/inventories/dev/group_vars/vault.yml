---
# Encrypt this file before committing real values:
#   ansible-vault encrypt ansible/inventories/dev/group_vars/vault.yml
# These are throwaway dev-only credentials to begin with, but treat the workflow as if they
# were not: never commit an unencrypted vault.yml with real secrets in it.

# Password of the `pathlens` PostgreSQL role created by the pathlens-infra release. Every
# service that talks to the database authenticates with it.
vault_pathlens_db_password: "local-dev-only-password"

# Password of the PostgreSQL superuser (`postgres`) in the same instance. Only pathlens-infra
# uses it; the applications never connect as superuser.
vault_pathlens_postgres_admin_password: "local-dev-only-admin-password"
