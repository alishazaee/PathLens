# Kafka endpoints and the metrics port are inherited from values.yaml - they are the same in
# every environment because the infrastructure is deployed alongside the services by the
# `pathlens-infra` release.

replicaCount: 1

image:
  tag: dev

config:
  kafkaConsumerConfig:
    groupId: processor-dev

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
