# Overrides for the production environment.

replicaCount: 3

image:
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

logging:
  level: WARN

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1500m
    memory: 1Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 2

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: alerting.pathlens.io
  tls:
    - secretName: alerting-pathlens-io-tls
      hosts:
        - alerting.pathlens.io

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
