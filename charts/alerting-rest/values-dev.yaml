# Overrides for the dev environment. Merge with values.yaml:
#   helm upgrade --install alerting-rest ./charts/alerting-rest -f values.yaml -f values-dev.yaml

replicaCount: 1

image:
  tag: dev

service:
  type: NodePort

logging:
  level: DEBUG

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false
  host: alerting-dev.pathlens.local

autoscaling:
  enabled: false
