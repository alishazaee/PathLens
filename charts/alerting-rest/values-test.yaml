# Overrides for the test/staging environment.

replicaCount: 2

image:
  tag: test

service:
  type: ClusterIP

logging:
  level: INFO

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 750m
    memory: 640Mi

ingress:
  enabled: true
  className: nginx
  host: alerting-test.pathlens.internal

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
