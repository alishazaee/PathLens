{{- if .Values.kafka.enabled }}
{{- $replicas := int .Values.kafka.controller.replicaCount }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka-headless
  labels:
    {{- include "pathlens.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "pathlens.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
  ports:
    - {name: client, port: 9092}
    - {name: controller, port: 9093}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka
  labels:
    {{- include "pathlens.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  selector:
    {{- include "pathlens.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
  ports:
    - {name: client, port: 9092, targetPort: client}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-kafka
  labels:
    {{- include "pathlens.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  serviceName: {{ .Release.Name }}-kafka-headless
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      {{- include "pathlens.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        {{- include "pathlens.labels" . | nindent 8 }}
        app.kubernetes.io/component: kafka
    spec:
      securityContext: {fsGroup: 1000}
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
          command: [/bin/bash, -ec]
          args:
            - |
              export KAFKA_NODE_ID="${HOSTNAME##*-}"
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.{{ .Release.Name }}-kafka-headless:9092"
              exec /etc/kafka/docker/run
          env:
            - {name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "{{- range $i := until $replicas }}{{ if $i }},{{ end }}{{ $i }}@{{ $.Release.Name }}-kafka-{{ $i }}.{{ $.Release.Name }}-kafka-headless:9093{{- end }}"
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: {{ min 3 $replicas | quote }}}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: {{ min 3 $replicas | quote }}}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
          ports:
            - {name: client, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          readinessProbe: {tcpSocket: {port: client}, initialDelaySeconds: 10, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: client}, initialDelaySeconds: 30, periodSeconds: 10}
          resources: {{- toYaml .Values.kafka.controller.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
      {{- if not .Values.kafka.controller.persistence.enabled }}
      volumes:
        - {name: data, emptyDir: {}}
      {{- end }}
  {{- if .Values.kafka.controller.persistence.enabled }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.kafka.controller.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.kafka.controller.persistence.size }}}
  {{- end }}
{{- end }}
