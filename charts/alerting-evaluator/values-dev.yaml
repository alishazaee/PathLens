# Kafka/PostgreSQL endpoints and the metrics port are inherited from values.yaml. The database
# password is supplied at install time (Ansible Vault, or --set), never from this file.

replicaCount: 1

image:
  tag: dev

config:
  kafkaConsumerConfig:
    groupId: alerting-evaluator-dev

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
