plugins {
    id 'java-conventions'
    id 'junit5-conventions'
}

dependencies {
    implementation(project(":alerting-system:client"))
    implementation(project(":logs-proto:camera:proto"))
    implementation(project(":common-libs:parallel-consumer"))
    implementation(libs.jts.core)
    implementation(libs.jedis)
    implementation(project(":alerting-system:protobuf"))
    implementation 'io.micrometer:micrometer-core:1.15.0'
    implementation 'io.micrometer:micrometer-registry-prometheus:1.15.0'
    implementation 'io.prometheus:prometheus-metrics-exporter-httpserver:1.3.10'
    implementation 'org.yaml:snakeyaml:2.6'
    implementation(libs.commonsLang)
    api(libs.bundles.jerseyClient)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.20.0'

    testImplementation(project(":common-libs:location-utils"))
    testImplementation(project(":common-libs:log-generator"))
    testImplementation(project(":alerting-system:rest"))
    testImplementation(project(":alerting-system:model"))
    testImplementation(project(":common-libs:test-extensions"))
    testRuntimeOnly 'javax.xml.bind:jaxb-api:2.3.1'
}