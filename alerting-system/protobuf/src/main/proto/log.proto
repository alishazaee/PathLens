syntax = "proto3";

package pathlens.target.log;

option java_package = "ir.pathlens.proto";
option java_outer_classname = "TargetLogProto";

message TargetLog {
    Location location = 1;
    bool violated = 2;
    bool should_notify = 3;
    string rule_id = 4;
    uint64 timestamp = 5;
}

message Location {
    double latitude = 1;
    double longitude = 2;
}
