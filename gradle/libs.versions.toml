[versions]
protobuf = "4.33.0"
jackson = "2.15.2"
junit = "5.10.0"
testContainers = "1.21.4"
kafka = "3.6.1"
jersey = "3.1.7"
lombok = "1.18.38"
jts = "1.20.0"
log4j = "2.21.0"
jedis = "5.1.0"

[libraries]
protobufJava = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }

jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
jackson-jaxrs-json-provider = { module = "com.fasterxml.jackson.jaxrs:jackson-jaxrs-json-provider", version.ref = "jackson" }

geohash = "ch.hsr:geohash:1.4.0"

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }

testcontainersJupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testContainers" }
testcontainersKafka = { module = "org.testcontainers:kafka", version.ref = "testContainers" }
testcontainersPostgresql = { module = "org.testcontainers:postgresql", version.ref = "testContainers" }

kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }

jakartaWsApi = "jakarta.ws.rs:jakarta.ws.rs-api:3.1.0"
jakartaValidation = "jakarta.validation:jakarta.validation-api:3.1.0"
jakartaPersistence = "jakarta.persistence:jakarta.persistence-api:3.1.0"
commonsLang = "org.apache.commons:commons-lang3:3.12.0"
guava = "com.google.guava:guava:32.1.2-jre"
springDocWebmvc = "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0"
parallelconsumer = "io.confluent.parallelconsumer:parallel-consumer-core:0.5.3.3"

jersey-client = { module = "org.glassfish.jersey.core:jersey-client", version.ref = "jersey" }
jersey-media-json-jackson = { module = "org.glassfish.jersey.media:jersey-media-json-jackson", version.ref = "jersey" }
jersey-hk2 = { module = "org.glassfish.jersey.inject:jersey-hk2", version.ref = "jersey" }

lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
jts-core = { module = "org.locationtech.jts:jts-core", version.ref = "jts" }

log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
log4j-layout-template-json = { module = "org.apache.logging.log4j:log4j-layout-template-json", version.ref = "log4j" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }

[bundles]
jerseyClient = ["jersey-client", "jersey-media-json-jackson", "jersey-hk2", "jackson-jaxrs-json-provider", "jackson-datatype-jsr310"]

